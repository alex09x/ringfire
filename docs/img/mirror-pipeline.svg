<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 960 340' width='960' height='340' font-family='JetBrains Mono, SFMono-Regular, Menlo, monospace' font-size='12'>
<defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1f2328'/></marker><marker id='n' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1d4ed8'/></marker><marker id='r' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#c0392b'/></marker></defs>
<rect width='960' height='340' fill='white'/>
<text x='16' y='24' font-size='15' font-weight='bold' fill='#1f2328'>One record's path: source ring to mirror ring, same sequence number everywhere</text>
<text x='16' y='42' fill='#6a737d'>push on the source host → read on the mirror host, measured, 64-byte records</text>
<rect x='16' y='56' width='330' height='190' rx='10' fill='#f6f8fa' stroke='#d0d7de'/><text x='28' y='76' fill='#1f2328' font-weight='bold' font-size='13'>source host</text>
<rect x='30' y='96' width='86' height='44' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='73.0' y='116.0' text-anchor='middle' fill='#1f2328' font-size='12' font-weight='bold'>producer</text><text x='73.0' y='132.0' text-anchor='middle' fill='#6a737d' font-size='11'>push()</text>
<line x1='116' y1='118' x2='142' y2='118' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<rect x='142' y='90' width='96' height='56' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.5'/><text x='190.0' y='116.0' text-anchor='middle' fill='#1f2328' font-size='12' font-weight='bold'>ring</text><text x='190.0' y='132.0' text-anchor='middle' fill='#6a737d' font-size='11'>seq 1, 2, 3 …</text>
<line x1='238' y1='104' x2='262' y2='104' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<rect x='262' y='86' width='74' height='36' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='299.0' y='102.0' text-anchor='middle' fill='#1f2328' font-size='11' font-weight='bold'>serve</text><text x='299.0' y='118.0' text-anchor='middle' fill='#6a737d' font-size='11'>raw reader</text>
<line x1='238' y1='132' x2='262' y2='160' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<rect x='262' y='150' width='74' height='36' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='299.0' y='166.0' text-anchor='middle' fill='#1f2328' font-size='11' font-weight='bold'>readers</text><text x='299.0' y='182.0' text-anchor='middle' fill='#6a737d' font-size='11'>0.1 µs</text>
<text x='181' y='222' text-anchor='middle' fill='#6a737d' font-size='11'>fixed slots, or descriptors + arena</text>
<rect x='356' y='66' width='250' height='170' rx='10' fill='#e8efff' stroke='#1d4ed8' stroke-dasharray='4 3'/>
<text x='481' y='86' text-anchor='middle' fill='#1d4ed8' font-weight='bold'>network</text>
<line x1='336' y1='118' x2='616' y2='118' stroke='#1d4ed8' stroke-width='1.5' marker-end='url(#n)'/><text x='476.0' y='111' text-anchor='middle' fill='#1d4ed8' font-size='11'>DATA: raw slot bytes + seq</text>
<text x='481' y='146' text-anchor='middle' fill='#1d4ed8' font-size='11'>UDP multicast · UDP unicast · TCP</text>
<line x1='616' y1='186' x2='336' y2='186' stroke='#1d4ed8' stroke-width='1.5' marker-end='url(#n)' stroke-dasharray='4 3'/><text x='476.0' y='201' text-anchor='middle' fill='#1d4ed8' font-size='11'>NAK / GAP over TCP</text>
<text x='481' y='214' text-anchor='middle' fill='#6a737d' font-size='11'>the source ring is</text>
<text x='481' y='228' text-anchor='middle' fill='#6a737d' font-size='11'>the retransmission buffer</text>
<rect x='616' y='56' width='328' height='190' rx='10' fill='#f6f8fa' stroke='#d0d7de'/><text x='628' y='76' fill='#1f2328' font-weight='bold' font-size='13'>mirror host</text>
<rect x='630' y='100' width='84' height='36' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='672.0' y='116.0' text-anchor='middle' fill='#1f2328' font-size='11' font-weight='bold'>mirror</text><text x='672.0' y='132.0' text-anchor='middle' fill='#6a737d' font-size='11'>one writer</text>
<line x1='714' y1='118' x2='736' y2='118' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<rect x='736' y='90' width='96' height='56' rx='6' fill='#fdecea' stroke='#c0392b' stroke-width='1.5'/><text x='784.0' y='116.0' text-anchor='middle' fill='#1f2328' font-size='12' font-weight='bold'>ring</text><text x='784.0' y='132.0' text-anchor='middle' fill='#6a737d' font-size='11'>same seq</text>
<line x1='832' y1='118' x2='852' y2='118' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/>
<rect x='852' y='96' width='80' height='44' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='892.0' y='116.0' text-anchor='middle' fill='#1f2328' font-size='11' font-weight='bold'>readers</text><text x='892.0' y='132.0' text-anchor='middle' fill='#6a737d' font-size='11'>as local</text>
<text x='780' y='222' text-anchor='middle' fill='#6a737d' font-size='11'>written in order, never duplicated</text>
<text x='30' y='276' fill='#1f2328' font-weight='bold' font-size='13'>0.1 µs</text>
<text x='30' y='292' fill='#6a737d' font-size='11'>same ring</text>
<text x='250' y='276' fill='#1f2328' font-weight='bold' font-size='13'>3.8 µs</text>
<text x='250' y='292' fill='#6a737d' font-size='11'>mirror on the same host</text>
<text x='490' y='276' fill='#1f2328' font-weight='bold' font-size='13'>30 µs</text>
<text x='490' y='292' fill='#6a737d' font-size='11'>mirror across a 1 GbE LAN</text>
<text x='730' y='276' fill='#1f2328' font-weight='bold' font-size='13'>51.7 ms, p99 +50 µs</text>
<text x='730' y='292' fill='#6a737d' font-size='11'>Tokyo → Los Angeles</text>
<text x='30' y='316' fill='#6a737d' font-size='11'>push → read, p50, measured on each host; remote hosts corrected for clock offset</text>
</svg>