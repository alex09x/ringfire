<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 900 480' width='900' height='480' font-family='JetBrains Mono, SFMono-Regular, Menlo, monospace' font-size='12'>
<defs><marker id='a' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1f2328'/></marker><marker id='n' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#1d4ed8'/></marker><marker id='r' markerWidth='8' markerHeight='8' refX='7' refY='4' orient='auto'><path d='M0,0 L8,4 L0,8 z' fill='#c0392b'/></marker></defs>
<rect width='900' height='480' fill='white'/>
<text x='16' y='24' font-size='15' font-weight='bold' fill='#1f2328'>The wire protocol: handshake over TCP, live records by UDP, repairs over TCP</text>
<text x='16' y='42' fill='#6a737d'>16-byte frame header: kind · flags · count · len · seq; records are raw slot bytes</text>
<rect x='120' y='56' width='120' height='32' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='180.0' y='77.0' text-anchor='middle' fill='#1f2328' font-size='12' font-weight='bold'>mirror</text>
<line x1='180' y1='88' x2='180' y2='466' stroke='#d0d7de' stroke-width='2'/>
<rect x='660' y='56' width='120' height='32' rx='6' fill='white' stroke='#1f2328' stroke-width='1.5'/><text x='720.0' y='77.0' text-anchor='middle' fill='#1f2328' font-size='12' font-weight='bold'>source</text>
<line x1='720' y1='88' x2='720' y2='466' stroke='#d0d7de' stroke-width='2'/>
<line x1='180' y1='110' x2='720' y2='110' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/><text x='450.0' y='103' text-anchor='middle' fill='#1f2328' font-size='11'>HELLO: wanted seq, magic, version, flags (UDP capable / prefers unicast)   [TCP]</text>
<line x1='720' y1='140' x2='180' y2='140' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/><text x='450.0' y='133' text-anchor='middle' fill='#1f2328' font-size='11'>GEOMETRY: capacity, slot size, schema, arena; first seq that will come   [TCP]</text>
<line x1='720' y1='170' x2='180' y2='170' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/><text x='450.0' y='163' text-anchor='middle' fill='#1f2328' font-size='11'>MULTICAST: group (0 = unicast), port, MTU, TTL, session, token   [TCP]</text>
<line x1='180' y1='200' x2='720' y2='200' stroke='#1d4ed8' stroke-width='1.5' marker-end='url(#n)' stroke-dasharray='6 3'/><text x='450.0' y='193' text-anchor='middle' fill='#1d4ed8' font-size='11'>PUNCH: token + session   [UDP; retry, then keep alive every 5 s]</text>
<line x1='720' y1='240' x2='180' y2='240' stroke='#1d4ed8' stroke-width='1.5' marker-end='url(#n)' stroke-dasharray='6 3'/><text x='450.0' y='233' text-anchor='middle' fill='#1d4ed8' font-size='11'>DATA seq 1–26   [UDP, session byte in flags]</text>
<line x1='720' y1='270' x2='450.0' y2='270' stroke='#c0392b' stroke-width='1.5' stroke-dasharray='4 3'/>
<text x='458.0' y='274' fill='#c0392b' font-weight='bold'>✕ lost</text>
<text x='450.0' y='263' text-anchor='middle' fill='#c0392b' font-size='11'>DATA seq 27–52</text>
<line x1='720' y1='300' x2='180' y2='300' stroke='#1d4ed8' stroke-width='1.5' marker-end='url(#n)' stroke-dasharray='6 3'/><text x='450.0' y='293' text-anchor='middle' fill='#1d4ed8' font-size='11'>DATA seq 53–78   [UDP]  → held back: 27 is missing</text>
<line x1='180' y1='330' x2='720' y2='330' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/><text x='450.0' y='323' text-anchor='middle' fill='#1f2328' font-size='11'>NAK 27–52   [TCP]</text>
<line x1='720' y1='360' x2='180' y2='360' stroke='#1f2328' stroke-width='1.5' marker-end='url(#a)'/><text x='450.0' y='353' text-anchor='middle' fill='#1f2328' font-size='11'>DATA seq 27–52   [TCP, from the source ring]  → 27–78 written in order</text>
<rect x='100.3' y='379' width='699.4' height='19' fill='white'/>
<text x='450.0' y='392' text-anchor='middle' fill='#6a737d' font-size='11'>GAP instead of DATA if the ring no longer holds the range: readers see a lapped count, never a reorder</text>
<line x1='720' y1='420' x2='180' y2='420' stroke='#1d4ed8' stroke-width='1.5' marker-end='url(#n)' stroke-dasharray='6 3'/><text x='450.0' y='413' text-anchor='middle' fill='#1d4ed8' font-size='11'>HEARTBEAT: last seq sent   [UDP, 1 ms idle; detects lost tail]</text>
<rect x='143.8' y='439' width='612.3' height='19' fill='white'/>
<text x='450.0' y='452' text-anchor='middle' fill='#6a737d' font-size='11'>a datagram from another session byte is ignored; a mirror can be served again as a source</text>
</svg>