<text x='20' y='330' fill='#6a737d' font-size='12'>Measured with 16 extra mirror processes on ONE remote host (not 16 hosts), one message every 100 µs:</text><text x='20' y='347' fill='#6a737d' font-size='12'>round trip p50 63.7 µs, p99 72.1 µs, max 84 µs, every mirror complete. The same with a TCP stream per</text><text x='20' y='364' fill='#6a737d' font-size='12'>mirror: p99 235 µs, max 11 ms, two mirrors behind. Inside one host the mirror costs 3.8 µs; each ring</text><text x='20' y='381' fill='#6a737d' font-size='12'>hand-off 0.1 µs.</text>
