[package]
name = "ringfire"
authors = ["alex09x <alex@prod.codes>"]
version = "0.3.0"
edition = "2024"
description = "Zero-copy lock-free inter-process communication (IPC) ring buffer and shared memory bus in Rust"
license = "MIT OR Apache-2.0"
repository = "https://github.com/alex09x/ringfire"
readme = "README.md"
keywords = ["ipc", "shared-memory", "lock-free", "ring-buffer", "hft"]
categories = ["concurrency", "asynchronous"]

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "ringfire"
path = "src/bin/ringfire.rs"

[dependencies]
memmap2 = "0.9"
libc = "0.2"
tokio = { version = "1", features = ["sync", "rt", "time", "macros"], optional = true }
futures-core = { version = "0.3", optional = true }

[features]
default = ["tokio"]
tokio = ["dep:tokio", "dep:futures-core"]

[dev-dependencies]
criterion = { version = "0.5" }
tokio = { version = "1", features = ["full"] }

[[bench]]
name = "throughput"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "blackboard"
harness = false

[[bench]]
name = "arena_vs_fixed"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
