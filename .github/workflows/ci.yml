name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # x86-64 (TSO) and AArch64, where missing fences actually bite. Linux only:
        # ringfire targets /dev/shm, futex and membarrier.
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (default features)
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy (no tokio)
        run: cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Test (debug)
        run: cargo test --no-fail-fast
      - name: Test (release)
        run: cargo test --release --no-fail-fast
      - name: Test (no tokio)
        run: cargo test --no-default-features --no-fail-fast
      - name: README quickstart
        run: cargo run --release --example quickstart
      - name: Benches compile
        run: cargo bench --no-run

  coverage:
    name: coverage (95% lines)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Coverage and threshold
        run: bash scripts/coverage.sh
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: target/coverage
          if-no-files-found: error

  benchmark-smoke:
    name: benchmark harnesses (TCP, multicast, unicast)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Validate benchmark execution and delivery
        run: bash scripts/bench-smoke.sh
      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-smoke
          path: target/bench-smoke
          if-no-files-found: error
